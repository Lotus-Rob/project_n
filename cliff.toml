# git-cliff: CHANGELOG.md and the next SemVer version from Conventional Commits.
# Used through `pixi run project_n release` (docs/design/0001 §11.3).

[changelog]
header = """
# Changelog

All notable changes to project_n, generated by git-cliff from commit messages. Do not edit.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**breaking:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "<!-- 00 -->Features" },
    { message = "^fix", group = "<!-- 01 -->Bug fixes" },
    { message = "^perf", group = "<!-- 02 -->Performance" },
    { message = "^refactor", group = "<!-- 03 -->Refactoring" },
    { message = "^test", group = "<!-- 04 -->Tests" },
    { message = "^build", group = "<!-- 05 -->Build and tooling" },
    { message = "^ci", group = "<!-- 06 -->CI" },
    { message = "^docs", group = "<!-- 07 -->Documentation" },
    { message = "^style", group = "<!-- 08 -->Style" },
    { message = "^revert", group = "<!-- 09 -->Reverts" },
    { message = "^chore", group = "<!-- 10 -->Other" },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"

[bump]
# Pre-1.0: breaking changes and features bump MINOR; everything else bumps PATCH.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
