# CI only runs project_n commands (docs/design/0001 §12); see .github/AGENTS.md.
name: ci

# Every push runs every job: main's ruleset requires all nine checks on each pull request, and a
# skipped job would count as passed (.github/rulesets/main.json).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIXI_VERSION: v0.83.0
  PROJECT_N_REGISTRY: ghcr.io/lotus-rob
  # Dependabot's runs get a read-only token, so they use the cache without pushing to it.
  PROJECT_N_PUSH_IMAGES: ${{ github.event_name == 'push' && github.actor != 'dependabot[bot]' && '1' || '0' }}
  PROJECT_N_XMAKE_CACHE: /home/runner/xmake-cache

# XMake package caches are keyed on the toolchain, the dependencies and the package overrides.
jobs:
  lint:
    # The non-build half of `check`: commit messages, quoted commands, formatting, clang-tidy.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      PROJECT_N_BUILD_CACHE: /home/runner/build-cache # object caches (.github/AGENTS.md)
    permissions:
      contents: read
      packages: write # the linux image cache in GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_LFS_SKIP_SMUDGE: "1" # pointers only: the LFS action fetches through Pixi, cached
        with:
          fetch-depth: 0
      - name: Commit range
        # commit-check's range, and what fmt and lint diff against (PROJECT_N_COMMIT_RANGE): on main the
        # pushed commits, on a branch all of them since main, which survives a force push that drops `before`.
        run: |
          if [ "${{ github.ref }}" = refs/heads/main ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ -n "${{ github.event.before }}" ]; then
            range="${{ github.event.before }}..HEAD"
          else
            range="origin/main..HEAD"
          fi
          echo "RANGE=$range" >> "$GITHUB_ENV"
          echo "PROJECT_N_COMMIT_RANGE=$range" >> "$GITHUB_ENV"
      - name: Log in to the image cache
        # Fork PRs have no write token; project_n then builds the image instead of pulling it.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin || true
      - name: Restore XMake packages
        id: xmake-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/xmake-cache
          key: xmake-lint-${{ hashFiles('pixi.toml', 'pixi.lock', 'xmake-requires.lock', 'xmake/repo/**') }}
          restore-keys: xmake-lint-
      - name: Restore objects
        id: objects
        # Warm on branch pushes only: main and tags compile cold (project_n enforces it too). Main only looks
        # its key up for Save objects; tags skip both.
        if: github.ref_type == 'branch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/build-cache
          lookup-only: ${{ github.ref == 'refs/heads/main' }}
          key: objects-lint-linux-clang-${{ hashFiles('pixi.toml', 'pixi.lock', 'xmake-requires.lock', 'xmake/repo/**', 'xmake.lua') }}-${{ github.sha }}
          restore-keys: objects-lint-linux-clang-${{ hashFiles('pixi.toml', 'pixi.lock', 'xmake-requires.lock', 'xmake/repo/**', 'xmake.lua') }}-
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true
          cache: true
      - uses: ./.github/actions/lfs
      - run: pixi run project_n selftest
      - run: pixi run project_n commit-check --range "$RANGE"
      - run: pixi run project_n fmt --check
      - run: pixi run project_n lint --container
      - name: Save XMake packages
        # Even when a later step failed: packages that built are still valid. Tags save nothing.
        if: always() && github.ref_type != 'tag' && steps.xmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/xmake-cache
          key: ${{ steps.xmake-cache.outputs.cache-primary-key }} # the restore's: builds may change the lock
      - name: Save objects
        # Even when a later step failed: objects that compiled are still valid. Main saves its cold build (unless
        # its lookup found the key already); tags save nothing.
        if: always() && github.ref_type != 'tag' && steps.objects.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/build-cache
          key: ${{ steps.objects.outputs.cache-primary-key }} # the restore's: builds may change the lock

  container:
    # One clean-container build per preset (`project_n artifact`): build, tests, runtime-dependency check, dist/.
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc, linux-clang, windows-msvc]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # the linux image cache in GHCR
    env:
      PROJECT_N_BUILD_CACHE: /home/runner/build-cache # object caches (.github/AGENTS.md)
      PROJECT_N_ACCEPT_MSVC_LICENSE: "1" # confirmed to fit the project (design doc 0001 O3); image stays on the runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_LFS_SKIP_SMUDGE: "1" # pointers only: the LFS action fetches through Pixi, cached
      - name: Log in to the image cache
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin || true
      - name: Restore XMake packages
        id: xmake-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/xmake-cache
          key: xmake-${{ matrix.preset }}-${{ hashFiles('pixi.toml', 'pixi.lock', 'xmake-requires.lock', 'xmake/repo/**') }}
          restore-keys: xmake-${{ matrix.preset }}-
      - name: Restore objects
        id: objects
        # Warm on branch pushes only: main and tags compile cold (project_n enforces it too). Main only looks
        # its key up for Save objects; tags skip both.
        if: github.ref_type == 'branch' && matrix.preset == 'linux-clang'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/build-cache
          lookup-only: ${{ github.ref == 'refs/heads/main' }}
          key: objects-container-linux-clang-${{ hashFiles('pixi.toml', 'pixi.lock', 'xmake-requires.lock', 'xmake/repo/**', 'xmake.lua') }}-${{ github.sha }}
          restore-keys: objects-container-linux-clang-${{ hashFiles('pixi.toml', 'pixi.lock', 'xmake-requires.lock', 'xmake/repo/**', 'xmake.lua') }}-
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true
          cache: true
      - uses: ./.github/actions/lfs
      - name: Restore MSVC install
        id: msvc-install
        if: matrix.preset == 'windows-msvc'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.xmake/project_n-tools/msvc-*
          key: msvc-install-${{ hashFiles('containers/msvc.Containerfile') }}
      # Setup: pull or build the image, and install MSVC for windows-msvc.
      - run: pixi run project_n image --preset ${{ matrix.preset }}
      - name: Save MSVC install
        if: matrix.preset == 'windows-msvc' && steps.msvc-install.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.xmake/project_n-tools/msvc-*
          key: msvc-install-${{ hashFiles('containers/msvc.Containerfile') }}
      - id: artifact
        run: pixi run project_n artifact --preset ${{ matrix.preset }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.archive }}
          path: dist/*.zip
      - name: Save XMake packages
        # Even when a later step failed: packages that built are still valid. Tags save nothing.
        if: always() && github.ref_type != 'tag' && steps.xmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/xmake-cache
          key: ${{ steps.xmake-cache.outputs.cache-primary-key }} # the restore's: builds may change the lock
      - name: Save objects
        # Even when a later step failed: objects that compiled are still valid. Main saves its cold build (unless
        # its lookup found the key already); tags save nothing.
        if: always() && github.ref_type != 'tag' && steps.objects.outputs.cache-hit != 'true' && matrix.preset == 'linux-clang'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/build-cache
          key: ${{ steps.objects.outputs.cache-primary-key }} # the restore's: builds may change the lock

  releasedbg:
    # linux-clang's releasedbg build in its container: the only mode that compiles Tracy's zones (0001 rule 22).
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # the linux image cache in GHCR
    env:
      PROJECT_N_BUILD_CACHE: /home/runner/build-cache # object caches (.github/AGENTS.md)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_LFS_SKIP_SMUDGE: "1" # pointers only: the LFS action fetches through Pixi, cached
      - name: Log in to the image cache
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin || true
      - name: Restore XMake packages
        id: xmake-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/xmake-cache
          key: xmake-releasedbg-linux-clang-${{ hashFiles('pixi.toml', 'pixi.lock', 'xmake-requires.lock', 'xmake/repo/**') }}
          # Then container linux-clang's: the same image and toolchain.
          restore-keys: |
            xmake-releasedbg-linux-clang-
            xmake-linux-clang-
      - name: Restore objects
        id: objects
        # Warm on branch pushes only: main and tags compile cold (project_n enforces it too). Main only looks
        # its key up for Save objects; tags skip both.
        if: github.ref_type == 'branch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/build-cache
          lookup-only: ${{ github.ref == 'refs/heads/main' }}
          key: objects-releasedbg-linux-clang-${{ hashFiles('pixi.toml', 'pixi.lock', 'xmake-requires.lock', 'xmake/repo/**', 'xmake.lua') }}-${{ github.sha }}
          restore-keys: objects-releasedbg-linux-clang-${{ hashFiles('pixi.toml', 'pixi.lock', 'xmake-requires.lock', 'xmake/repo/**', 'xmake.lua') }}-
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true
          cache: true
      - uses: ./.github/actions/lfs
      - run: pixi run project_n image --preset linux-clang
      - run: pixi run project_n build --preset linux-clang --mode releasedbg --container
      - name: Save XMake packages
        # Even when a later step failed: packages that built are still valid. Tags save nothing.
        if: always() && github.ref_type != 'tag' && steps.xmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/xmake-cache
          key: ${{ steps.xmake-cache.outputs.cache-primary-key }} # the restore's: builds may change the lock
      - name: Save objects
        # Even when a later step failed: objects that compiled are still valid. Main saves its cold build (unless
        # its lookup found the key already); tags save nothing.
        if: always() && github.ref_type != 'tag' && steps.objects.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/build-cache
          key: ${{ steps.objects.outputs.cache-primary-key }} # the restore's: builds may change the lock

  windows:
    # Native MSVC: the authoritative Windows build, and the only place MSVC's ASan can run. One build per entry.
    name: windows (${{ matrix.build }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: release
            test: --mode release
          - build: address
            test: --sanitizer address
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_LFS_SKIP_SMUDGE: "1" # pointers only: the LFS action fetches through Pixi, cached
      - name: Restore MSVC toolset
        id: msvc
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # What the versioned VC.14.50 component adds to the image's VS install.
          path: |
            C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.50.*
            C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\14.50
          key: msvc-${{ hashFiles('containers/windows/buildtools.vsconfig') }}
      - name: Pinned MSVC toolset (containers/windows/buildtools.vsconfig)
        if: steps.msvc.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -property installationPath
          $proc = Start-Process -Wait -PassThru -FilePath "$installer\setup.exe" -ArgumentList @(
            'modify', '--installPath', "`"$vs`"", '--config', "`"$PWD\containers\windows\buildtools.vsconfig`"",
            '--quiet', '--norestart', '--nocache')
          if ($proc.ExitCode -notin 0, 3010) { throw "VS installer failed: $($proc.ExitCode)" }
      - name: Save MSVC toolset
        # Straight after installing, whatever happens to the rest of the job.
        if: steps.msvc.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.50.*
            C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\14.50
          key: msvc-${{ hashFiles('containers/windows/buildtools.vsconfig') }}
      - name: Restore XMake packages
        id: xmake-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.xmake/project_n # packages_dir() in tools/project_n.py
          key: xmake-windows-${{ matrix.build }}-${{ hashFiles('pixi.toml', 'pixi.lock', 'xmake-requires.lock', 'xmake/repo/**') }}
          # Then the other entry's: the same toolchain, some packages to add.
          restore-keys: |
            xmake-windows-${{ matrix.build }}-
            xmake-windows-
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true
          cache: true
      - uses: ./.github/actions/lfs
      - if: matrix.build == 'address' # the only place it runs on Windows (paths, shims): the shorter build's entry
        run: pixi run project_n selftest
      # Report only: CI needs no commit hook or podman. Exit code 3 means problems found; anything else is a bug.
      - run: pixi run project_n doctor; if ($LASTEXITCODE -notin 0, 3) { exit 1 }; exit 0
      - run: pixi run project_n test --preset windows-msvc ${{ matrix.test }}
      - name: Save XMake packages
        # Even when a later step failed: packages that built are still valid. Tags save nothing.
        if: always() && github.ref_type != 'tag' && steps.xmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.xmake/project_n # packages_dir() in tools/project_n.py
          key: ${{ steps.xmake-cache.outputs.cache-primary-key }} # the restore's: builds may change the lock

  macos:
    # Native macos-clang on Apple Silicon: the only place it can build (docs/design/0001 §5.7). One build per
    # entry on branch pushes: release (tests, then the artefact from that build) and ASan; on main and tags the
    # artefact rebuilds in a clean room.
    name: macos (${{ matrix.build }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: release
            test: --mode release
          - build: address
            test: --sanitizer address
    runs-on: macos-26
    timeout-minutes: 180
    env:
      PROJECT_N_BUILD_CACHE: /Users/runner/build-cache # object caches (.github/AGENTS.md)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_LFS_SKIP_SMUDGE: "1" # pointers only: the LFS action fetches through Pixi, cached
      - name: XMake bundle checksum
        run: echo "XMAKE_TOOL=$(grep -o 'XMAKE_MACOS_SHA256 = "[0-9a-f]*"' tools/project_n.py | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Restore XMake
        id: xmake-tool
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.xmake/project_n-tools
          key: xmake-tool-macos-${{ env.XMAKE_TOOL }}
      - name: Restore XMake packages
        id: xmake-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.xmake/project_n # packages_dir() in tools/project_n.py
          key: xmake-macos-${{ matrix.build }}-${{ hashFiles('pixi.toml', 'pixi.lock', 'xmake-requires.lock', 'xmake/repo/**') }}
          # Then the other entry's: the same toolchain, some packages to add.
          restore-keys: |
            xmake-macos-${{ matrix.build }}-
            xmake-macos-
      - name: Restore objects
        id: objects
        # Warm on branch pushes only: main and tags compile cold (project_n enforces it too). Main only looks
        # its key up for Save objects; tags skip both.
        if: github.ref_type == 'branch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Users/runner/build-cache
          lookup-only: ${{ github.ref == 'refs/heads/main' }}
          key: objects-macos-${{ matrix.build }}-${{ hashFiles('pixi.toml', 'pixi.lock', 'xmake-requires.lock', 'xmake/repo/**', 'xmake.lua') }}-${{ github.sha }}
          restore-keys: objects-macos-${{ matrix.build }}-${{ hashFiles('pixi.toml', 'pixi.lock', 'xmake-requires.lock', 'xmake/repo/**', 'xmake.lua') }}-
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true
          cache: true
      - uses: ./.github/actions/lfs
      # Report only: CI needs no commit hook or podman. Exit code 3 means problems found; anything else is a bug.
      - run: pixi run project_n doctor || [ $? -eq 3 ] # also downloads XMake on a cache miss
      - name: Save XMake
        if: steps.xmake-tool.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.xmake/project_n-tools
          key: xmake-tool-macos-${{ env.XMAKE_TOOL }}
      - run: pixi run project_n test --preset macos-clang ${{ matrix.test }}
      - id: artifact
        # Packages the release build the tests just ran on; main and tags rebuild in a clean room (project_n).
        if: matrix.build == 'release'
        run: pixi run project_n artifact --preset macos-clang --reuse-build
      - if: matrix.build == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.archive }}
          path: dist/*.zip
      - name: Save XMake packages
        # Even when a later step failed: packages that built are still valid. Tags save nothing.
        if: always() && github.ref_type != 'tag' && steps.xmake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.xmake/project_n # packages_dir() in tools/project_n.py
          key: ${{ steps.xmake-cache.outputs.cache-primary-key }} # the restore's: builds may change the lock
      - name: Save objects
        # Even when a later step failed: objects that compiled are still valid. Main saves its cold build (unless
        # its lookup found the key already); tags save nothing.
        if: always() && github.ref_type != 'tag' && steps.objects.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Users/runner/build-cache
          key: ${{ steps.objects.outputs.cache-primary-key }} # the restore's: builds may change the lock

  release:
    # A vX.Y.Z tag: every preset's archives into a draft GitHub release, for the user to check and publish.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, container, releasedbg, windows, macos]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_LFS_SKIP_SMUDGE: "1" # pointers only: the LFS action fetches through Pixi, cached
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: project_n-*
          path: dist
          merge-multiple: true
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true
          cache: true
      - run: pixi run project_n publish
        env:
          GH_TOKEN: ${{ github.token }}
