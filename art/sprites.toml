# The sprites the atlas step packs (design doc 0002 §9): each one's image is assets/sprites/<name>.png.
# A sprite's place in this list is its stable ID: add new ones at the end, never reorder or remove.
#
# Images: transparent 8-bit PNGs with straight alpha (premultiplied at load), painted for the
# 1920x1080 reference resolution, at most PAGE_SIZE minus two gutters on a side.
# foot: the point, in pixels from the image's top-left, that stands on the ground: the y-sort
# position for props and units, and the point an instance's position places. Default: the
# bottom centre. Ground layers use [0, 0] so their position is their top-left corner.

[ground]
foot = [0, 0]

[rock_large]
foot = [90, 112]

[rock_small]
foot = [46, 60]

[pine]
foot = [120, 372]

[shrine]
foot = [110, 244]

[fox]
foot = [54, 68]

[cultivator]
foot = [36, 122]

[orb_blue]
foot = [16, 16]

[orb_red]
foot = [8, 8]

[shadow]
foot = [32, 12]

[cell_plain]
foot = [0, 0]

[cell_mountain]
foot = [0, 0]

[cell_forest]
foot = [0, 0]

[cell_city]
foot = [0, 0]

[treant_blighted]
foot = [150, 360]

[wisp_red]
foot = [49, 140]

[crane]
foot = [110, 150]

[tree_dead]
foot = [110, 280]

[fox_spirit]
foot = [100, 260]

[fox_yellow]
foot = [55, 72]

[hut]
foot = [100, 180]

[stele]
foot = [50, 220]

[crystal_ice]
foot = [70, 170]

[cell_snow]
foot = [0, 0]

[orb_gold]
foot = [16, 16]

[villager]
foot = [32, 112]

# The abilities' effects (phase 6 chunk 4). All but the sword are white, tinted by their element's colour. Each one's
# foot is its centre, where the path puts it, but the bars' square's: its left middle, so a bar grows from its left.
[sword]
foot = [5, 20]

[halo]
foot = [24, 24]

[fire_bolt]
foot = [12, 24]

[lance_strike]
foot = [48, 48]

[solid]
foot = [0, 4]
