# The game's strings (design doc 0002.4.2 §5), each by the name the code knows it by (core/strings.hpp), with its
# text in English (en) and Simplified Chinese (zh). Every string needs both. settings.yaml's `language` picks one.
cultivator_name:
  en: Cultivator
  zh: 修士
tablet_caption:
  en: 问道 # the caption is the same in both
  zh: 问道
fox_name:
  en: Fox
  zh: 狐
label_stack:
  en: "{name} (+{count})" # {name} and {count} are filled in; the stack is a creature's name and how many more share its place
  zh: "{name}（+{count}）"
