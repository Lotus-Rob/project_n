  - { symbol: "%", name: marsh, cost: 25 }
  - { symbol: ".", name: meadow, cost: 10 }
  - { symbol: ",", name: grassland, cost: 10 }
  - { symbol: "T", name: forest, cost: 16 }
  - { symbol: "n", name: hills, cost: 20 }
  - { symbol: "#", name: rock, cost: 40 }
  - { symbol: "*", name: snow, cost: 30 }
  - { symbol: "A", name: peaks, cost: impassable }
