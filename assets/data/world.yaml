# How people move: pace in ticks per unit of cost (a road tile, cost 4, takes 64 ticks on foot). Profile 0, on_foot, is the
# one every traveller walks by; a profile may add all_kinds: <cost|impassable>, kinds: { <name>: <cost|impassable> } and
# features: { road, river, bridge, ford }, laid over the kinds' costs above.
profiles:
  - { key: on_foot, ticks_per_cost: 16 }
# The travellers between cities: the share of a city's people setting out each month (per thousand), the days they stay,
# how far they will go (reach_base plus reach_per_power for each whole point of power, in cost units) and the power from
# which one is a cultivator rather than a trader. Tuned so about 2,500 to 3,300 of the 50,000 are on the roads at once
# from the first tick, mortals reaching the next town (the capital's nearest cost about 130, the sect's 225) and the
# strong the far side of the map (the sect to the isle costs 562).
travel: { share_per_mille: 60, stay_days: [2, 5], reach_base: 300, reach_per_power: 20, cultivator_power: 5 }
