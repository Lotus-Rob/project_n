# The test bed's creatures. In debug builds the running game reloads this
# file when it changes. Distances are world units (1920 across the arena), speeds per tick (60 a
# second). health: at full. sight: how far it sees over the world map, in tiles. sprite: an image in assets/sprites/, by
# name. orbit: the circle a creature walks, if any, around the player (around: player) or the player's starting point
# (around: start, the default).
cultivator:
  sprite: cultivator
  health: 1000
  walk_speed: 4.0 # at full stick
  sight: 3 # tiles it sees on the world map, 0 to 64 (0 when absent)
fox:
  sprite: fox
  health: 1200
  walk_speed: 0.0
  orbit:
    radius: 300.0
    wobble: 40.0 # in and out of the circle, three times a lap
    speed: 0.006 # radians per tick; negative goes anticlockwise
    around: player
