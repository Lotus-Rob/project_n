# The world map's look: presentation, not hashed or saved, reloaded live by debug builds (a broken
# edit keeps the old look). It says which sprites draw the map; world.yaml says what the map is.
#
# kinds:   each terrain kind of world.yaml by name (at most 16): `wash` its colour and `strength` (0 to 1), `stamps`
#          the painted stamps over it: `sprites`, `density` (0 to 1, the chance a tile gets one), `size` the least and
#          greatest width in tiles, `jitter` (0 to 1) how far one strays from its cell, `thin_below` the zoom (0 to 2)
#          under which they thin out (0 never), `mist` whether mist gathers among them
# roads:   16 sprites, by which of a tile's north, east, south and west neighbours carry a road (bits 1, 2, 4, 8)
# bridge:  a road over a river: `across` where the road runs east to west, `down` where it runs north to south
# ford:    drawn over the river at a ford
# markers: `city` and one sprite per danger sort the map uses (a sort the map doesn't use is ignored)
# ground:  the paper under the map: `paper` colour, `grain` its fibre's strength, `edge_warp` and `edge_soft` how far
#          noise moves the edge between two kinds and how wide it blends (tiles, the blend up to 1), `blotch` how
#          unevenly a wash pools, `water` the map's `shallow` and `deep` kinds and the `depth_tiles` (up to 3.5) between
#          them, `shore` the line at the water's edge (`colour`, `strength`, `width`), `grid` the tile grid (`colour`,
#          `strength`, `fade` the zoom where it is whole and then where it is gone, the first not below the second)
# veil:    the haze over the ground: `colour`, patch `scale` in tiles, `strength` (0 to 1)
# mist:    the puffs among stamps: `sprites`, `colour`, `strength`, `chance` of one beside a stamp, `width` the least and
#          greatest as a share of the stamp's width
# river:   the ribbon: `width` of the water and `edge` of the whole edge band under it, both in tiles, `colour`,
#          `edge_colour`, `edge_strength` (0 to 1)
# places:  paintings for places: `city`, `dangers` one per danger sort the map uses (a sort it doesn't use is ignored),
#          `by_key` for the places with a key of their own (a key no place has is refused)
# route:   the player's route and the target cursor: `dot` every `spacing` world units along the line, `marker` on its
#          end, `cursor` on the cursor's tile
# fog:     the clouds over unexplored land and the colours of explored land's edge (required): `clouds` the sprites to
#          pick from, `cloud_width` a cloud's width in cell spacings before its own 0.85 to 1.45 draw, `bob` the
#          amplitude (cell spacings) and period (seconds) of its up and down, `drift` how far an uncovered cloud
#          drifts in tiles, `fade_seconds` how long it takes to fade, `drain` how much colour land seen but not near
#          loses (`strength`, 0 to 1) toward `sepia`, `mist` a colour laid over it at `strength` (0 to 1), `shade` the
#          colour under the clouds so no land shows between them; colours are sRGB, three numbers 0 to 255
kinds:
  deep_water:
    wash: [88, 124, 148]
    strength: 0.68
    stamps:
      sprites: [stamp_water_0, stamp_water_1, stamp_water_2, stamp_water_3]
      density: 0.08
      size: [0.7, 0.9]
      jitter: 0.15
      thin_below: 0.5
      mist: false
  shallows:
