  dangers:
    haunted_forest: painting_haunted_forest
    mountain_pass: painting_mountain_pass
    shrine: painting_shrine
    cave: painting_cave
    cliff: painting_cliff
    corrupt_village: painting_corrupt_village
  by_key: { capital: painting_capital }
