# The world map's look: presentation, not hashed or saved, reloaded live by debug builds (a broken
# edit keeps the old look). It says which sprites draw the map; world.yaml says what the map is.
#
# kinds:   each terrain kind of world.yaml by name, a list of variant sprites (at least one; a tile picks by its place)
# roads:   16 sprites, by which of a tile's north, east, south and west neighbours carry a road (bits 1, 2, 4, 8)
# rivers:  16 sprites, the same for rivers
# bridge:  a road over a river: `across` where the road runs east to west, `down` where it runs north to south
# ford:    drawn over the river at a ford
# markers: `city` and one sprite per danger sort the map uses (a sort the map doesn't use is ignored)
# route:   the player's route and the target cursor: `dot` every `spacing` world units along the line, `marker` on its
#          end, `cursor` on the cursor's tile
# fog:     the clouds over unexplored land and the colours of explored land's edge (required): `clouds` the sprites to
#          pick from, `cloud_width` a cloud's width in cell spacings before its own 0.85 to 1.45 draw, `bob` the
#          amplitude (cell spacings) and period (seconds) of its up and down, `drift` how far an uncovered cloud
#          drifts in tiles, `fade_seconds` how long it takes to fade, `drain` how much colour land seen but not near
#          loses (`strength`, 0 to 1) toward `sepia`, `mist` a colour laid over it at `strength` (0 to 1), `shade` the
#          colour under the clouds so no land shows between them; colours are sRGB, three numbers 0 to 255
kinds:
  deep_water: [terrain_water_0, terrain_water_1]
  shallows: [terrain_shallows_0, terrain_shallows_1]
  sand: [terrain_sand_0, terrain_sand_1]
  marsh: [terrain_marsh_0, terrain_marsh_1]
  meadow: [terrain_meadow_0, terrain_meadow_1]
  grassland: [terrain_grass_0, terrain_grass_1]
  forest: [terrain_forest_0, terrain_forest_1]
  hills: [terrain_hills_0, terrain_hills_1]
  rock: [terrain_rock_0, terrain_rock_1]
  snow: [terrain_snow_0, terrain_snow_1]
  peaks: [terrain_peaks_0, terrain_peaks_1]
roads:
  [road_0, road_1, road_2, road_3, road_4, road_5, road_6, road_7, road_8, road_9, road_10, road_11, road_12, road_13, road_14, road_15]
rivers:
  [river_0, river_1, river_2, river_3, river_4, river_5, river_6, river_7, river_8, river_9, river_10, river_11, river_12, river_13, river_14, river_15]
bridge: { across: bridge_h, down: bridge_v }
ford: ford
markers:
  city: marker_city
  haunted_forest: marker_haunted_forest
  mountain_pass: marker_mountain_pass
  shrine: marker_shrine
  cave: marker_cave
  cliff: marker_cliff
  corrupt_village: marker_corrupt_village
route: { dot: route_dot, spacing: 48, marker: route_marker, cursor: target_tile }
fog:
  clouds: [cloud_0, cloud_1, cloud_2, cloud_3, cloud_4, cloud_5, cloud_6, cloud_7, cloud_8, cloud_9, cloud_10, cloud_11, cloud_12, cloud_13, cloud_14, cloud_15]
  cloud_width: 1.15
  bob: { amplitude: 0.03, period: 4.0 }
  drift: 0.3
  fade_seconds: 0.5
  drain: { strength: 0.85, sepia: [160, 138, 106] }
  mist: { colour: [239, 233, 220], strength: 0.25 }
  shade: [214, 206, 192]
